name: CI

on:
  pull_request:
    branches: [turbo]
  push:
    branches: [turbo]

permissions:
  contents: read


jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OAUTH_CLIENT_ID: ci-test-client
      GITHUB_OAUTH_CLIENT_SECRET: ci-test-secret
      GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret
      RUN_GITHUB_CREDENTIAL_TESTS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Validate data
        run: pnpm validate:data

      - name: Validate repository
        run: pnpm validate:repository

      - name: Build
        run: pnpm build
